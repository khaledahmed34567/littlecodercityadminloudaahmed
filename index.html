/* الخطوط: بيحاول يحمّلها من فولدر fonts/ الأول (للعمل بدون إنترنت)، وبعدين من الرابط الأونلاين */
@font-face{font-family:'RasHead';src:url('fonts/sbox5j.otf') format('opentype'),url('https://files.catbox.moe/sbox5j.otf') format('opentype');font-weight:100 900;font-display:swap}
@font-face{font-family:'RasHead2';src:url('fonts/sgpf34.otf') format('opentype'),url('https://files.catbox.moe/sgpf34.otf') format('opentype');font-weight:100 900;font-display:swap}
@font-face{font-family:'RasBody';src:url('fonts/3tbj44.otf') format('opentype'),url('https://files.catbox.moe/3tbj44.otf') format('opentype');font-weight:100 900;font-display:swap}
@font-face{font-family:'RasBody2';src:url('fonts/4rjalb.otf') format('opentype'),url('https://files.catbox.moe/4rjalb.otf') format('opentype');font-weight:100 900;font-display:swap}
:root{--f-h1:'RasHead2','RasHead','Cairo','Segoe UI',Tahoma,sans-serif;--f-h2:'RasHead','RasHead2','Cairo','Segoe UI',Tahoma,sans-serif;--f-t:'RasBody','RasBody2','Cairo','Segoe UI',Tahoma,sans-serif;--f-t2:'RasBody2','RasBody','Cairo','Segoe UI',Tahoma,sans-serif;--f-form:'RasHead','RasHead2','Cairo','Segoe UI',Tahoma,sans-serif}
:root{--bg:#fff3d6;--card:#fff;--ink:#3b2a63;--soft:#7a6a9e;--a:#ff6b9d;--b:#1fb5ab;--c:#ffd93d;--d:#6c5ce7;--e:#f39c12;--ok:#22a85a;--bad:#e74c3c;--key:#f0e8ff;--sh:rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241b3d;--card:#33285a;--ink:#fff4d6;--soft:#c9bdf0;--key:#4a3c7d;--sh:rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#241b3d;--card:#33285a;--ink:#fff4d6;--soft:#c9bdf0;--key:#4a3c7d;--sh:rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI','Tahoma',system-ui,sans-serif;font-weight:600;min-height:100%;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
.hide{display:none!important}
.ltr{direction:ltr}
.top{background:var(--d);color:#fff;border-radius:0 0 28px 28px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.15);position:sticky;top:0;z-index:20}
.top img{height:50px;width:auto;display:block;cursor:pointer}
.sp{flex:1}
.chip{border:0;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-weight:800;padding:6px 12px;cursor:pointer;font-size:17px;min-width:42px;line-height:1.3}
.chip:hover{background:rgba(255,255,255,.32)}
.chip.sc{background:var(--c);color:#3b2a63;font-weight:900;font-size:19px}
.wrap{max-width:860px;margin:0 auto;padding:6px 14px 40px}
/* home */
.hello{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:14px 18px;box-shadow:0 8px 0 var(--sh);margin:16px 0 12px}
.av{font-size:48px;line-height:1;background:var(--key);border-radius:50%;width:78px;height:78px;display:grid;place-items:center;border:0;cursor:pointer;flex:none;box-shadow:0 4px 0 var(--sh)}
.hello .tx{flex:1;min-width:0}
.hello h1{margin:0;font-size:24px;font-weight:900}
.hello small{color:var(--soft);font-size:15px;display:block;margin:2px 0 8px}
.bar{height:14px;background:var(--key);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c));border-radius:99px;transition:width .6s}
.fire{font-size:16px;font-weight:800;color:var(--e)}
.next{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:24px;background:var(--a);color:#fff;padding:12px 18px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #c2467a;margin:6px 0 4px;text-align:right}
.next:active{transform:translateY(4px);box-shadow:0 2px 0 #c2467a}
.next .em{font-size:38px}
.world{margin:22px 0 6px}
.wh{display:flex;align-items:center;gap:10px;margin:0 6px 10px}
.wh .we{font-size:34px}
.wh h2{margin:0;font-size:24px;font-weight:900}
.wh small{color:var(--soft);font-size:14px;display:block;margin-top:-2px}
.wh .cnt{margin-inline-start:auto;background:var(--card);border-radius:99px;padding:3px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--sh)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:0;border-radius:24px;background:var(--card);color:var(--ink);padding:12px 8px 10px;box-shadow:0 6px 0 var(--sh);cursor:pointer;text-align:center;border-top:9px solid var(--wc);position:relative}
.tile .em{font-size:46px;display:block;line-height:1.25}
.tile b{display:block;font-size:18px;font-weight:900;margin:2px 0}
.tile small{display:block;color:var(--soft);font-size:13px;min-height:2.6em;line-height:1.35;font-weight:600}
.tile .st{font-size:20px;letter-spacing:2px;direction:ltr;display:block}
.tile .st s{text-decoration:none;opacity:.25;filter:grayscale(1)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.tile.rec{outline:4px dashed var(--a);outline-offset:2px}
.tile.rec::after{content:'ابدأ هنا';position:absolute;top:-4px;inset-inline-start:8px;background:var(--a);color:#fff;font-size:12px;font-weight:900;padding:1px 9px;border-radius:99px}
.foot{text-align:center;color:var(--soft);font-size:14px;margin-top:26px}
/* game shell */
.gbar{display:flex;align-items:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.gbar h2{margin:0;font-size:22px;font-weight:900;flex:1;min-width:120px}
.gb{border:0;border-radius:16px;background:var(--card);padding:8px 14px;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--sh)}
.gb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
#hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;order:5}
.pill{display:inline-block;background:var(--card);border-radius:18px;padding:3px 14px;font-size:19px;font-weight:900;box-shadow:0 3px 0 var(--sh)}
.stage{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 8px 0 var(--sh);text-align:center;min-height:280px;position:relative}
.stage p{font-size:18px;line-height:1.7;margin:6px 0}
.msg{min-height:30px;font-size:20px;font-weight:900;color:var(--ok);margin:6px 0 2px}
.msg.warn{color:var(--e)}
canvas{width:100%;max-width:480px;height:auto;border-radius:20px;display:block;margin:0 auto;touch-action:none}
.arena{position:relative;height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(#ffe9f2,#ffd0e3);touch-action:manipulation}
.arena.sea{background:linear-gradient(#aee6ff,#2f86d6)}
.arena.sky2{background:linear-gradient(#7ad7ff,#d8f4ff);height:380px}
/* mouse games */
.magic{position:absolute;left:30%;top:36%;border:0;border-radius:999px;font-weight:900;font-size:24px;padding:16px 26px;color:#fff;background:hsl(var(--h,330),85%,60%);box-shadow:0 6px 0 hsl(var(--h,330),70%,40%);cursor:pointer;transition:left .25s,top .25s}
.magic:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.bub{position:absolute;bottom:-100px;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.35) 38%,rgba(120,200,255,.35));box-shadow:inset 0 0 0 3px rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;animation:rise linear forwards}
.bub i{font-style:normal;font-size:var(--f,34px);transition:transform .18s,opacity .18s}
.bub i.x{transform:scale(1.8);opacity:0}
.bub.gold{background:radial-gradient(circle at 30% 28%,#fff6b0,#ffd93d 60%,#f0a500)}
@keyframes rise{from{bottom:-100px}to{bottom:calc(100% + 10px)}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:6px auto}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(#6b4a2b,#3f2a17);overflow:hidden;position:relative;cursor:pointer;box-shadow:inset 0 -8px 0 rgba(0,0,0,.35)}
.hole i{font-style:normal;position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(36px,12vw,58px);transform:translateY(110%);transition:transform .12s}
.hole.up i{transform:translateY(0)}
.hole.shk{animation:sh .3s}
/* keyboard games */
.sky{position:relative;height:230px;width:120px;margin:6px auto;border-radius:60px;background:linear-gradient(#1c1450,#6c5ce7);overflow:hidden}
.sky .moon{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:34px}
.sky #rk{position:absolute;left:50%;bottom:8px;font-size:48px;transform:translateX(-50%);transition:bottom .35s}
.kp{margin:6px 0;min-height:84px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.kp.bad{animation:sh .3s}
.cap{display:inline-block;background:var(--key);border:3px solid var(--d);border-bottom-width:8px;border-radius:16px;padding:8px 24px;font-size:34px;font-weight:900;color:var(--d);margin:4px;direction:ltr}
.cap.big1{font-size:56px;padding:4px 34px}
.kp small{display:block;width:100%;color:var(--soft);font-size:16px}
.pic{font-size:92px;line-height:1.1}
.word{direction:ltr;margin:8px 0}
.lt{display:inline-block;width:56px;height:68px;line-height:62px;border-radius:16px;background:var(--bg);border:3px dashed var(--soft);margin:4px;font-size:38px;font-weight:900;text-transform:uppercase;color:var(--ok)}
.lt.bad{animation:sh .3s;border-color:var(--bad)}
.lt.now{border-color:var(--d);background:var(--key)}
.balloon{position:absolute;left:0;top:0;width:54px;height:66px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;will-change:transform}
.balloon b{color:#fff;font-size:30px;font-weight:900;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.balloon::after{content:'';position:absolute;bottom:-18px;left:50%;width:2px;height:18px;background:rgba(0,0,0,.35)}
.balloon.boom{transition:transform .2s,opacity .2s;opacity:0;scale:1.7}
/* arrows games */
.grid{direction:ltr;display:grid;grid-template-columns:repeat(var(--cols,6),1fr);gap:4px;max-width:var(--mw,330px);margin:10px auto}
.cell{aspect-ratio:1;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,40px);position:relative}
.cell.wall{background:#c9a27a}
.cell .dm{position:absolute;inset:0;display:grid;place-items:start center;font-size:14px;color:var(--a);line-height:1}
.cell.bump{animation:sh .3s}
/* on-screen controls */
.ctl{margin-top:12px;direction:ltr}
.ctl.none{display:none}
.ctl .row{display:flex;justify-content:center;gap:4px;margin:4px 0}
.k{border:0;border-bottom:4px solid rgba(0,0,0,.2);border-radius:10px;background:var(--card);color:var(--ink);font-weight:800;font-size:16px;min-width:clamp(24px,7.2vw,42px);height:42px;text-transform:uppercase;cursor:pointer;padding:0 6px;box-shadow:0 0 0 2px var(--key) inset;touch-action:manipulation}
.k.w-space{min-width:clamp(120px,36vw,220px)}
.k.w-enter,.k.w-shift,.k.w-backspace,.k.w-tab,.k.w-esc{min-width:clamp(48px,12vw,74px);font-size:13px;text-transform:none}
.k.hit,.dp.hit{background:var(--c);transform:translateY(3px);border-bottom-width:1px}
.k.hint,.dp.hint{animation:pulse .7s infinite alternate;background:var(--a);color:#fff}
@keyframes pulse{to{transform:scale(1.18)}}
.dpad{display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,66px);gap:6px;justify-content:center}
.dp{border:0;border-radius:18px;background:var(--d);color:#fff;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.dp:active,.dp.hit{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.dp.u{grid-column:2;grid-row:1}.dp.l{grid-column:1;grid-row:2}.dp.dn{grid-column:2;grid-row:2}.dp.r{grid-column:3;grid-row:2}
.ctl.spaceonly{display:flex;justify-content:center;gap:10px}
.ctl .sbig{border:0;border-radius:20px;background:var(--d);color:#fff;font-size:24px;font-weight:900;padding:16px 30px;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer}
/* block editor */
.prog{background:var(--bg);border-radius:20px;padding:8px;min-height:90px;text-align:right;margin-top:10px}
.blist{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:6px;min-height:42px}
.blist.focus{outline:3px dashed var(--a);outline-offset:-2px}
.blk{border-radius:14px;padding:6px 8px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bh{display:flex;align-items:center;gap:8px;font-size:18px}
.bh .bi{font-size:22px}
.bh b{font-weight:900}
.bv{border:0;border-radius:10px;background:rgba(255,255,255,.9);color:#3b2a63;font-weight:900;font-size:16px;padding:1px 10px;cursor:pointer}
.bv .dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px}
.bx{border:0;background:rgba(0,0,0,.2);color:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;margin-inline-start:auto;padding:0}
.b-fd,.b-tfd{background:var(--b)}.b-rt,.b-lt,.b-trt,.b-tlt{background:var(--d)}.b-loop{background:var(--e)}.b-col{background:var(--a)}
.blk>.blist{background:rgba(255,255,255,.22);margin-top:6px}
.empty{color:var(--soft);font-size:15px;text-align:center;padding:10px}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pb{border:0;border-radius:16px;color:#fff;font-weight:900;font-size:17px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.runrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big{border:0;border-radius:999px;font-weight:900;font-size:24px;padding:12px 28px;margin:6px 4px;color:#fff;background:var(--a);box-shadow:0 6px 0 #c2467a;cursor:pointer}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #c2467a}
.big:disabled{opacity:.5;cursor:default}
.big.go{background:var(--ok);box-shadow:0 6px 0 #167a41}
.big.sm{font-size:18px;padding:9px 18px;background:var(--d);box-shadow:0 5px 0 #4a3cb5}
.big.alt{background:var(--b);box-shadow:0 6px 0 #138077}
.info{font-size:15px;color:var(--soft);margin:4px 0;min-height:22px}
.hint2{background:var(--key);border-radius:16px;padding:8px 12px;font-size:16px;margin:8px 0;line-height:1.6}
.chal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.chal button{border:0;border-radius:14px;background:var(--key);padding:6px 10px;font-weight:800;font-size:15px;cursor:pointer}
.chal button.on{background:var(--d);color:#fff}
/* patterns & simon */
.seq{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:12px 0}
.slot{min-width:58px;height:58px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:32px;font-weight:900;padding:0 6px}
.slot.q{background:var(--c);color:#3b2a63}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;margin:10px auto;direction:ltr}
.opt{border:0;border-radius:20px;background:var(--key);font-size:36px;font-weight:900;padding:14px 6px;cursor:pointer;box-shadow:0 5px 0 var(--sh);position:relative}
.opt small{position:absolute;top:4px;left:10px;font-size:13px;color:var(--soft)}
.opt.bad{animation:sh .3s;background:#ffd6d6}
.opt.good{background:#c8f5d9}
.pads{display:grid;grid-template-columns:repeat(3,92px);grid-template-rows:repeat(3,92px);gap:8px;justify-content:center;margin:10px auto;direction:ltr}
.pad{border:0;border-radius:22px;font-size:40px;color:#fff;cursor:pointer;opacity:.55;transition:opacity .1s,transform .1s;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.pad.lit{opacity:1;transform:scale(1.1)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(36,27,61,.62);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:32px;padding:22px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .25s;max-height:100%;overflow:auto}
.modal h3{margin:0 0 6px;font-size:28px;font-weight:900}
.modal p{font-size:18px;line-height:1.7;margin:6px 0}
.rs{font-size:60px;letter-spacing:4px;direction:ltr}
.rs s{text-decoration:none;opacity:.2;filter:grayscale(1)}
.mbtns{display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.avs button{border:3px solid transparent;background:var(--key);border-radius:18px;font-size:34px;padding:6px 0;cursor:pointer;position:relative}
.avs button.on{border-color:var(--a)}
.avs button:disabled{opacity:.45;cursor:default}
.avs small{display:block;font-size:11px;font-weight:800}
.nm{width:100%;border:3px solid var(--key);border-radius:16px;background:var(--bg);color:var(--ink);font:inherit;font-weight:800;font-size:20px;padding:8px 14px;text-align:center;-webkit-user-select:text;user-select:text}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fly{position:fixed;top:-50px;font-size:34px;pointer-events:none;animation:fall 1.7s ease-in forwards;z-index:60}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:900;font-size:18px;z-index:70;animation:pop .2s;max-width:90%;text-align:center}
:focus-visible{outline:4px solid var(--c);outline-offset:2px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}.pads{grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px)}.top img{height:40px}}
@media (prefers-reduced-motion:reduce){.fly,.lt.bad,.kp.bad,.hole.shk,.cell.bump,.opt.bad,.k.hint,.dp.hint,.modal,.toast{animation:none}.bub{animation-duration:12s!important}}

/* أيقونات SVG */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.ttl{width:.95em;height:.95em}
.chip .ic{width:1.25em;height:1.25em;vertical-align:-.25em}
.chip.sc .ic{width:1.1em;height:1.1em;vertical-align:-.18em}
.av .ic{width:58px;height:58px}
.cap .ic{width:.85em;height:.85em;vertical-align:-.1em}
.k .ic{width:17px;height:17px}
.dp .ic{width:30px;height:30px}
.sbig .ic{width:1em;height:1em}
.slot .ic{width:38px;height:38px}
.opt .ic{width:46px;height:46px}
.pad .ic{width:46px;height:46px}
.rs .ic{margin:0 2px}
.bx .ic{width:12px;height:12px;vertical-align:0}
.bh .bi .ic{width:24px;height:24px;vertical-align:-.3em}
.pb .ic{width:1.2em;height:1.2em;vertical-align:-.25em}
.big .ic,.gb .ic{width:1.15em;height:1.15em;vertical-align:-.22em}
.avs button .ic{width:38px;height:38px}
.chal .ic{width:1.2em;height:1.2em;vertical-align:-.25em}
.wh .we .ic{width:1em;height:1em}
.tile .st .ic{width:20px;height:20px}
.pill .ic{width:.95em;height:.95em;vertical-align:-.15em}
.toast .ic{width:1.1em;height:1.1em;vertical-align:-.2em}
.hole i .ic{width:1em;height:1em}
.next .em .ic{width:1em;height:1em}
.cell .dm .ic{width:14px;height:14px}

.login{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--ink);border-radius:24px;padding:10px 18px;font-size:19px;font-weight:900;text-decoration:none;box-shadow:0 6px 0 var(--sh);margin:6px 0 4px}
.login .ic{width:1.3em;height:1.3em}

/* ===== خطوط ===== */
body{font-family:var(--f-t);font-synthesis:none}
h1,h2,.atitle,.wh h2,.gbar h2{font-family:var(--f-h1)}
h3,.tile b,.next,.big,.modal h3,.cap,.opt,.lvb b,.pb{font-family:var(--f-h2)}
b,strong,.pill,.chip,.gb,.cnt,.lvl{font-family:var(--f-t2)}
.authf,.authf *,.authf input,.authf select,.authf button{font-family:var(--f-form)}
/* ===== المستويات والحالة ===== */
.lvs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.lvb{border:0;border-radius:20px;background:var(--key);color:var(--ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px;cursor:pointer;box-shadow:0 5px 0 var(--sh)}
.lvb.lk{opacity:.55;cursor:default}
.lvb .st{display:inline-flex;gap:2px}.lvb .st .ic{width:24px;height:24px}
.lvtag{display:inline-block;background:var(--c);color:#3b2a63;border-radius:99px;padding:0 12px;font-size:.62em;vertical-align:middle}
.tile .lvl{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.tile.lockd{opacity:.6}.tile .lkb,.tile .vdb{position:absolute;top:10px;inset-inline-end:10px;font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-weight:900}
.tile .vdb{background:transparent;padding:0;font-size:20px;line-height:1}.tile .vdb .ic{width:22px;height:22px}
.timeleft{background:var(--card);border-radius:18px;padding:6px 14px;text-align:center;font-size:17px;box-shadow:0 4px 0 var(--sh);margin:6px 0}
.vid{width:100%;border-radius:18px;max-height:62vh;background:#000}
/* ===== شاشات ولي الأمر والتسجيل ===== */
#auth{min-height:70vh;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.authf{width:100%;max-width:480px}
.authbox{background:var(--card);border-radius:30px;padding:22px 20px;box-shadow:0 10px 0 var(--sh);text-align:right}
.authbox.center{text-align:center}
.aicon{width:132px;height:132px;border-radius:30px;box-shadow:0 6px 0 var(--sh);margin:0 auto 8px;display:block}
.atitle{font-size:28px;margin:6px 0;font-weight:900}.atitle.sm{font-size:24px;text-align:center}
.asub{color:var(--soft);font-size:16px;line-height:1.7;margin:6px 0 12px;text-align:center}
.anote{background:var(--key);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.7;margin:10px 0}
.fl{display:block;margin:10px 0}.fl>span{display:block;font-size:15px;margin-bottom:4px;color:var(--soft);font-weight:800}
.in{width:100%;border:3px solid var(--key);border-radius:16px;background:var(--bg);color:var(--ink);font-size:19px;font-weight:800;padding:10px 14px;-webkit-user-select:text;user-select:text}
.in:focus{outline:none;border-color:var(--d)}
.pinrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consents{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6;background:var(--bg);border-radius:14px;padding:8px 10px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--d)}
.chk a,.alinks a,.foot a{color:var(--d);text-decoration:underline;cursor:pointer;font-weight:800}
.aerr{background:#ffd6d6;color:#9c1c1c;border-radius:14px;padding:8px 12px;font-size:15px;font-weight:800;margin:8px 0}
.alinks{text-align:center;font-size:15px;color:var(--soft);margin:10px 0 0}
.authbox .big{width:100%;display:block;margin:10px 0}
.steps{display:flex;justify-content:center;gap:8px;margin:8px 0}
.steps i{width:30px;height:30px;border-radius:50%;background:var(--key);display:grid;place-items:center;font-style:normal;font-weight:900;color:var(--soft)}
.steps i.on{background:var(--d);color:#fff}.steps i.done{background:var(--ok);color:#fff}
.kids{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.kid{border:0;border-radius:22px;background:var(--bg);color:var(--ink);padding:12px;cursor:pointer;text-align:center;box-shadow:0 5px 0 var(--sh)}
.kid .ic{width:60px;height:60px;display:block;margin:0 auto 4px}.kid b{display:block;font-size:19px}.kid small{color:var(--soft)}
.pin{max-width:340px}
.pdots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.pdots i{width:18px;height:18px;border-radius:50%;background:var(--key);border:2px solid var(--d)}.pdots i.on{background:var(--d)}
.pmsg{min-height:22px;color:var(--bad);font-weight:800}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pk button{border:0;border-radius:18px;background:var(--key);color:var(--ink);font-size:26px;font-weight:900;padding:12px 0;cursor:pointer;box-shadow:0 4px 0 var(--sh)}

.daily:not(.done) .ic{animation:wob 1.6s ease-in-out infinite}
.bdg:not(.off){animation:tilein .5s both}

terms:{t:'شروط الاستخدام',ic:'book',s:[
['1. التعريفات',['• «التطبيق»: منصة «مدينة المبرمج الصغير» بكل نسخها (نسخة الطفل، نسخة اللابتوب، تطبيق ولي الأمر، والموقع).','• «الجهة المشغّلة»: {publisher}.','• «ولي الأمر»: الأب أو الأم أو الوصي القانوني البالغ (18 سنة فأكثر) الذي يُنشئ الحساب ويتحمّل مسؤوليته.','• «الطفل»: الشخص الأقل من 18 سنة الذي يلعب عبر ملف أنشأه ولي أمره.','• «الملف»: ملف اللعب الخاص بطفل داخل حساب ولي الأمر.']],
['2. قبول الشروط',['باستخدامك التطبيق أو إنشاء حساب أو الضغط على «أوافق» فأنت تقرّ بأنك قرأت هذه الشروط وسياسة الخصوصية وسياسة حماية الطفل وفهمتها ووافقت عليها.','إذا لم توافق على أي بند فيرجى عدم إنشاء حساب أو استخدام التطبيق.']],
['3. من يحق له إنشاء حساب',['• الحساب لا يُنشئه إلا ولي أمر بالغ (18 سنة فأكثر) أو من له سلطة قانونية على الطفل، ويقدّم رقم هاتفه وبريده وكوداً سرياً.','• التطبيق مصمَّم للأطفال من 5 إلى 13 سنة تقريباً، ولا يحق للطفل إنشاء حساب بنفسه.','• يجب أن تكون البيانات التي يقدّمها ولي الأمر صحيحة وكاملة ومحدَّثة.','• يجوز اللعب بوضع «بدون حساب» على الجهاز نفسه، وفي هذه الحالة يُحفظ التقدّم على الجهاز فقط.']],
['4. الحساب والأمان',['• ولي الأمر مسؤول عن سرّية بريده وكلمة مروره والكود السري، وعن كل نشاط يتم عبر حسابه.','• يجب إبلاغنا فوراً إذا اشتبهت في دخول غير مصرّح به.','• الكود السري (PIN) يمنع الطفل من تغيير الإعدادات أو الخروج من وضع الطفل أو تجاوز وقت اللعب، ويُطلب أيضاً لفتح تطبيق متابعة الطفل.','• من حقنا تعليق الحساب مؤقتاً لحمايته إذا ظهر نشاط مشبوه.']],
['5. مسؤولية ولي الأمر',['• الإشراف على استخدام الطفل للتطبيق وتحديد أوقات اللعب المناسبة.','• اختيار اسم مستعار للطفل لا يكشف اسمه الحقيقي أو مدرسته أو عنوانه.','• عدم مشاركة بيانات الدخول مع الطفل أو مع الغير.','• مراجعة سياسة الخصوصية وسياسة حماية الطفل والموافقة عليهما بوصفه صاحب الصلاحية على بيانات الطفل.']],
['6. الاستخدام المقبول',['يلتزم المستخدم بما يلي، ويُمنع:','• محاولة اختراق التطبيق أو قاعدة بياناته أو تجاوز إجراءات الحماية أو فحص الثغرات دون إذن مكتوب.','• نسخ الكود أو الأيقونات أو المحتوى أو إعادة بيعه أو نشره دون إذن.','• استخدام برامج آلية للتلاعب بالنجوم أو النتائج.','• إدخال معلومات مسيئة أو مضللة أو تخص غيرك في أي حقل (مثل الاسم المستعار).','• استخدام التطبيق لأي غرض مخالف للقانون.']],
['7. المحتوى التعليمي وحدود الضمان',['• التطبيق وسيلة تعليمية ترفيهية، ولا يُعدّ بديلاً عن التعليم المدرسي أو الإشراف التربوي.','• النجوم والمستويات والألقاب مؤشرات تحفيزية فقط، وليست تقييماً أكاديمياً رسمياً.','• نبذل جهدنا لجودة المحتوى وخلوّه من الأخطاء، لكننا لا نضمن خلوّه التام منها.']],
['8. الملكية الفكرية',['• جميع الحقوق في التطبيق (الكود والتصميم والأيقونات والشخصية «كودو» والنصوص والألعاب) محفوظة لـ{owner}، ولا يجوز نسخها أو إعادة نشرها دون إذن كتابي.','• نمنحك ترخيصاً محدوداً وغير حصري وغير قابل للتحويل لاستخدام التطبيق لأغراض شخصية وتعليمية غير تجارية.','• الخطوط المستخدمة تخضع لتراخيص أصحابها.']],
['9. التوفّر والتحديثات والمحتوى',['• تضيف الإدارة من وقت لآخر ألعاباً ومستويات ومقاطع فيديو شرح لطريقة اللعب، ويحق لها تعديلها أو إيقافها.','• قد يتوقف التطبيق أو بعض خصائصه مؤقتاً للصيانة أو لظروف خارجة عن إرادتنا.','• قد نضيف ألعاباً أو نعدّل مستويات أو نزيل ميزات، وسنعلن التغييرات الجوهرية داخل التطبيق.','• ميزات المزامنة والمتابعة تحتاج اتصالاً بالإنترنت، أما اللعب نفسه فيعمل دون اتصال.']],
['10. حدود المسؤولية',['• يُقدَّم التطبيق «كما هو» دون ضمانات صريحة أو ضمنية بقدر ما يسمح به القانون.','• لا نتحمّل مسؤولية أي ضرر غير مباشر أو فقدان بيانات ناتج عن عطل الجهاز أو الإنترنت أو عن مشاركة ولي الأمر بيانات دخوله.','• لا يحدّ هذا البند من مسؤوليتنا في الحالات التي لا يجيز القانون الإعفاء منها.']],
['11. إيقاف الحساب وحذفه',['• يحق لولي الأمر حذف ملف طفل أو حذف الحساب بالكامل في أي وقت من تطبيق ولي الأمر، وسيتم حذف البيانات المرتبطة به.','• يحق لنا إيقاف أي حساب يخالف هذه الشروط، مع إخطار ولي الأمر متى أمكن.']],
['12. التغييرات على الشروط',['قد نحدّث هذه الشروط من وقت لآخر. عند وجود تغيير جوهري سنطلب موافقة ولي الأمر من جديد قبل متابعة الاستخدام. استمرار الاستخدام بعد الإخطار يعني الموافقة على النسخة المحدّثة.']],
['13. القانون الواجب التطبيق',['تخضع هذه الشروط لقوانين جمهورية مصر العربية، وتختص محاكمها بالنظر في أي نزاع، مع عدم الإخلال بحقوق المستهلك وحقوق حماية الطفل المقررة بقوانين بلد إقامتك.']],
['14. التواصل',['لأي استفسار أو شكوى: {email}']]]},
privacy:{t:'سياسة الخصوصية',ic:'lock',s:[
['1. مقدّمة',['نحن في {publisher} نحترم خصوصية الأطفال وأولياء الأمور. توضّح هذه السياسة أي بيانات نجمعها، ولماذا، وكيف نحميها، وما حقوقك. وهي مكتوبة بما يتوافق مع قانون حماية البيانات الشخصية المصري رقم 151 لسنة 2020، ومع مبادئ قانون حماية خصوصية الأطفال على الإنترنت الأمريكي (COPPA) واللائحة الأوروبية العامة لحماية البيانات (GDPR) بخصوص بيانات الأطفال.']],
['2. الجهة المسؤولة عن البيانات',['{publisher} — للتواصل: {email}']],
['3. البيانات التي نجمعها من ولي الأمر',['• الاسم (كما يكتبه ولي الأمر) والبريد الإلكتروني ورقم الهاتف (لتأمين الحساب والتواصل مع ولي الأمر عند الحاجة، ولا يظهر للأطفال).','• معرّف الحساب (UID) الذي ينشئه نظام تسجيل الدخول. كلمة المرور لا نراها ولا نخزّنها نصاً، وتُدار عبر خدمة تسجيل الدخول الآمنة.','• بصمة مشفّرة (Hash) للكود السري (PIN)، وليس الكود نفسه.','• سجل الموافقات: نوع الموافقة، رقم نسخة الشروط، وتاريخ ووقت الموافقة.']],
['4. البيانات التي نجمعها عن الطفل (الحد الأدنى فقط)',['• اسم مستعار (يُنصح ألا يكون الاسم الحقيقي).','• سنة الميلاد فقط (لتحديد الفئة العمرية).','• الشخصية (الأيقونة) المختارة.','• بيانات اللعب: النجوم والمستويات والنتائج وتقدّم المراحل وعدد أيام اللعب المتتالية.','• سجل نشاط مختصر: اسم اللعبة، المستوى، النتيجة، مدة اللعب، والتاريخ.','• مدة اللعب اليومية وحدّ الوقت الذي يضعه ولي الأمر.']],
['5. بيانات لا نجمعها إطلاقاً',['• الاسم الكامل للطفل أو صورته أو صوته أو فيديو له.','• الموقع الجغرافي أو العنوان أو اسم المدرسة.','• جهات الاتصال أو الرسائل أو الميكروفون أو الكاميرا.','• معرّفات الإعلانات أو بيانات التتبع لأغراض تسويقية.','• لا توجد دردشة ولا تعليقات ولا ميزات تواصل بين الأطفال أو مع الغرباء.','• لا توجد عمليات شراء داخل التطبيق ولا إعلانات.']],
['6. أغراض استخدام البيانات',['• تشغيل الحساب وحفظ تقدّم الطفل ومزامنته بين الأجهزة.','• عرض تقارير المتابعة لولي الأمر في تطبيق ولي الأمر.','• تطبيق حدود وقت اللعب التي يحدّدها ولي الأمر.','• تحسين الألعاب والمستويات اعتماداً على إحصاءات مجمّعة لا تحدّد هوية الطفل.','• حماية الحسابات ومنع إساءة الاستخدام.','لا نستخدم بيانات الأطفال في الإعلانات أو بناء ملفات تسويقية، ولا نبيعها ولا نؤجّرها.']],
['7. الأساس القانوني: موافقة ولي الأمر',['نعالج بيانات الطفل بناءً على موافقة صريحة ومسبقة من ولي أمره عند إنشاء الحساب، ويمكنه سحبها في أي وقت بحذف ملف الطفل أو الحساب. لا نجمع بيانات أي طفل قبل هذه الموافقة (باستثناء وضع «بدون حساب» الذي يبقى على الجهاز فقط).']],
['8. مشاركة البيانات',['لا نشارك البيانات إلا مع مزوّدي خدمات يعالجونها نيابةً عنا وبما يلزم لتشغيل التطبيق فقط:','• Google Firebase (تسجيل الدخول وقاعدة البيانات والاستضافة)، وهم ملتزمون باتفاقيات معالجة بيانات.','• جهات رسمية إذا ألزمنا القانون بذلك بطلب قانوني صحيح.','لا نشارك أي بيانات مع معلنين أو وسطاء بيانات أو شبكات تواصل.']],
['9. نقل البيانات خارج بلدك',['قد تُخزَّن البيانات على خوادم في دول أخرى يوفرها مزوّد الخدمة السحابية. نتخذ الضمانات التعاقدية والتقنية المناسبة لحماية البيانات أثناء النقل والتخزين.']],
['10. مدة الاحتفاظ بالبيانات',['• بيانات الحساب والأطفال: طوال مدة بقاء الحساب نشطاً.','• عند حذف ملف طفل أو الحساب: تُحذف البيانات المرتبطة به من قاعدة البيانات الحيّة فوراً تقريباً، ومن النسخ الاحتياطية خلال مدة أقصاها 30 يوماً.','• الحسابات غير النشطة لأكثر من 24 شهراً قد تُحذف بعد إشعار ولي الأمر.','• سجل الموافقات قد نحتفظ به المدة التي يلزمها القانون لإثبات الموافقة.']],
['11. أمان البيانات',['• تشفير الاتصال (HTTPS/TLS) أثناء نقل البيانات.','• قواعد وصول تمنع أي حساب من قراءة بيانات حساب آخر، وتمنع تعديل محتوى الألعاب إلا للإدارة.','• كود سري (PIN) لحماية إعدادات ولي الأمر داخل نسخة الطفل وتطبيق المتابعة.','• تقليل البيانات المخزّنة إلى الحد الأدنى اللازم.','• لا يوجد نظام آمن بنسبة 100%، ونلتزم بإبلاغ ولي الأمر والجهات المختصة عند وقوع اختراق يؤثر على بياناته وفق القانون.']],
['12. حقوق ولي الأمر والطفل',['يحق لولي الأمر، نيابةً عن الطفل ولنفسه:','• الاطلاع على البيانات المحفوظة (من تطبيق ولي الأمر).','• تصحيح البيانات (الاسم المستعار، سنة الميلاد، الشخصية).','• تصدير نسخة من البيانات بصيغة JSON.','• حذف ملف الطفل أو الحساب بالكامل.','• سحب الموافقة أو الاعتراض على المعالجة في أي وقت.','• تقديم شكوى إلى الجهة المختصة بحماية البيانات الشخصية في بلده.','لممارسة أي حق عبر البريد: {email} وسنردّ خلال 30 يوماً.']],
['13. التخزين المحلي (Local Storage) والكوكيز',['يستخدم التطبيق التخزين المحلي في جهازك لحفظ التقدّم وإعدادات الصوت والمظهر وحالة الدخول. لا نستخدم كوكيز إعلانية ولا أدوات تحليل تتبّع الأفراد.']],
['14. خدمات وموارد خارجية',['• تسجيل الدخول بجوجل اختياري لولي الأمر فقط، ولا يظهر للطفل.','• قد تُحمَّل الخطوط من خادم خارجي إذا لم تكن محفوظة داخل التطبيق، وفي هذه الحالة قد يرى ذلك الخادم عنوان الاتصال (IP) فقط.','• لا توجد روابط خارجية يمكن للطفل الوصول إليها من داخل التطبيق.']],
['15. خصوصية الأطفال',['• لا نطلب من الطفل أي معلومة شخصية تتجاوز الاسم المستعار وسنة الميلاد.','• إذا علمنا أننا جمعنا بيانات طفل دون موافقة ولي أمره فسنحذفها دون تأخير.','• وصول ولي الأمر لبيانات طفله يتم دائماً عبر حسابه المحمي.']],
['16. تغيير هذه السياسة',['قد نحدّث السياسة، وسنعلمك داخل التطبيق بالتغييرات الجوهرية ونطلب موافقتك من جديد عند الحاجة. تاريخ آخر تحديث: {version}.']],
['17. التواصل',['أسئلة الخصوصية والشكاوى: {email}']]]},
child:{t:'سياسة حماية الطفل',ic:'shield',s:[
['1. التزامنا',['مصلحة الطفل الفضلى هي الأساس في كل قرار تصميم. نلتزم بتوفير بيئة لعب وتعلّم آمنة ومناسبة للعمر، بما يتوافق مع مبادئ قانون الطفل المصري رقم 12 لسنة 1996 وتعديلاته واتفاقية حقوق الطفل.']],
['2. بيئة آمنة بالتصميم',['• لا دردشة، ولا رسائل، ولا تعليقات، ولا ملفات شخصية عامة، ولا تواصل بين الأطفال أو مع أي غريب.','• لا إعلانات ولا عمليات شراء داخل التطبيق ولا مكافآت مالية.','• لا توجد روابط خارجية في نسخة الطفل.','• لا يطلب التطبيق صوراً ولا موقعاً ولا ميكروفوناً ولا كاميرا.','• لا يوجد محتوى مستخدمين، فكل محتوى الألعاب أعدّه فريقنا.']],
['3. ملاءمة المحتوى للعمر',['• جميع الألعاب تعليمية ومرحة (ماوس، كيبورد، منطق، برمجة) بلا عنف ولا ألفاظ سيئة ولا صور مخيفة.','• الصور كرتونية بسيطة وآمنة، والنصوص باللغة العربية الواضحة مع كلمات إنجليزية تعليمية بسيطة.','• مستويات الصعوبة تتدرج (سهل، متوسط، صعب) حتى لا يشعر الطفل بالإحباط.']],
['4. الموافقة الأبوية الموثّقة',['• لا يُنشأ ملف لطفل إلا بعد إنشاء حساب ولي أمر بالغ والموافقة صراحةً على الشروط والخصوصية وهذه السياسة.','• نحتفظ بسجل موافقة يتضمن نوع الموافقة ونسخة النص وتاريخها.','• يستطيع ولي الأمر سحب الموافقة بحذف الملف أو الحساب في أي لحظة.']],
['5. تقليل البيانات',['نجمع أقل قدر ممكن: اسم مستعار، سنة ميلاد، شخصية، وتقدّم اللعب. ننصح بشدة بعدم استخدام الاسم الكامل للطفل. التفاصيل الكاملة في سياسة الخصوصية.']],
['6. بوابة ولي الأمر والكود السري',['• نسخة اللابتوب تمنع لقطات الشاشة وتسجيل الشاشة أثناء اللعب لحماية خصوصية الطفل.','• كل الإعدادات (تبديل الطفل، الحسابات، حدود الوقت، الخروج) محمية بكود سري من 4 أرقام يختاره ولي الأمر عند التسجيل، ويكتبه أيضاً لفتح تطبيق المتابعة.','• تسجيل الدخول والتسجيل وروابط الشروط للكبار فقط.','• ننصح بعدم استخدام تاريخ ميلاد الطفل أو أرقام سهلة (1234) كالكود السري.']],
['7. أدوات ولي الأمر للمتابعة والتحكم',['• لوحة متابعة: النجوم، المستوى، الألعاب المفضلة، أيام اللعب، ومدة اللعب اليومية.','• سجل نشاط حديث لكل ملف.','• قفل ألعاب محددة لكل طفل وفتحها في أي وقت.','• تحديد حد يومي لوقت اللعب (من 10 دقائق إلى ساعتين أو بدون حد). عند انتهائه يتوقف اللعب ويحتاج تمديده لرمز PIN.','• إضافة أطفال متعددين وتعديل بياناتهم وحذفهم.','• تصدير البيانات وحذف الحساب نهائياً.']],
['8. اللعب الصحي',['نشجّع على توازن صحي بين الشاشات والنشاط البدني والنوم. نوصي بما يلي:','• فاصل راحة كل 20 دقيقة تقريباً، والنظر لمسافة بعيدة 20 ثانية.','• الجلوس بوضعية سليمة وإضاءة مناسبة وشاشة على مسافة مريحة.','• عدم اللعب قبل النوم بساعة على الأقل.','• اللعب مع الطفل أحياناً ومناقشة ما تعلّمه.']],

const dayKey=(d=new Date())=>'d'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+(h>>>0).toString(16)}}
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const AUTHERR={'auth/email-already-in-use':'البريد ده مسجّل قبل كده. جرّب تسجيل الدخول.','auth/invalid-email':'البريد الإلكتروني مش صحيح.','auth/weak-password':'كلمة المرور ضعيفة (8 حروف على الأقل).','auth/user-not-found':'مفيش حساب بالبريد ده.','auth/wrong-password':'كلمة المرور غلط.','auth/invalid-credential':'البريد أو كلمة المرور غلط.','auth/too-many-requests':'محاولات كتير. استنى شوية وجرّب تاني.','auth/network-request-failed':'مفيش اتصال بالإنترنت.','auth/popup-closed-by-user':'اتقفلت نافذة جوجل قبل ما تكمّل.','auth/popup-blocked':'المتصفح منع نافذة جوجل. اسمح بالنوافذ المنبثقة وجرّب تاني.','auth/operation-not-supported-in-this-environment':'الدخول بجوجل بيحتاج تفتح التطبيق من رابط الموقع (https) أو localhost.','auth/account-exists-with-different-credential':'البريد ده مسجّل بطريقة تانية. ادخل بالبريد وكلمة المرور.','auth/requires-recent-login':'لازم تسجّل الدخول من جديد قبل حذف الحساب.','file-protocol':'افتح التطبيق من موقعك أو من تطبيق اللابتوب (مش من الملف مباشرة).','auth/unauthorized-domain':'الدومين ده مش مضاف في Firebase (Authorized domains).'};

function makeDemo(){
 const KEY='kcdb1',CK='kcconfig1',SK2='kcsupport1',subs=new Set();
 const sd=()=>{try{return JSON.parse(localStorage.getItem(SK2)||'{}')}catch(e){return {}}},sw=o=>{localStorage.setItem(SK2,JSON.stringify(o));notify()};
 const rd=()=>{try{return Object.assign({accounts:[],children:[],events:[],session:null},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {accounts:[],children:[],events:[],session:null}}};
 const wr=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}notify()};
 const notify=()=>subs.forEach(f=>{try{f()}catch(e){}});
 addEventListener('storage',e=>{if(e.key===KEY||e.key===CK||e.key===SK2)notify()});
 let authCb=[];const fire=()=>{const u=B.user();authCb.forEach(f=>f(u))};
 const acc=()=>{const s=rd();return s.accounts.find(a=>a.uid===s.session)};
 const B={mode:'demo',
  async init(){},
  user(){const a=acc();return a?{uid:a.uid,email:a.email,name:a.name}:null},
  onAuth(cb){authCb.push(cb);cb(B.user())},
  async register({name,email,password,pin,phone,consent}){const s=rd();email=email.trim().toLowerCase();
   if(s.accounts.some(a=>a.email===email))throw {code:'auth/email-already-in-use'};
   if(password.length<8)throw {code:'auth/weak-password'};
   const uid=rid();s.accounts.push({uid,name,email,phone:phone||'',passHash:await sha(email+password),pinHash:await sha(uid+pin),consent:{...consent,ts:Date.now()},createdAt:Date.now()});s.session=uid;wr(s);fire();return B.user()},
  async login(email,password){const s=rd();email=email.trim().toLowerCase();const a=s.accounts.find(x=>x.email===email);
   if(!a||a.passHash!==await sha(email+password))throw {code:'auth/invalid-credential'};s.session=a.uid;wr(s);fire();return B.user()},
  async google(){throw {message:'الدخول بجوجل مش متاح دلوقتي. استخدم البريد وكلمة المرور.'}},
  async verifyPassword(pw){const s=rd();const a=s.accounts.find(x=>x.uid===s.session);if(!a||a.passHash!==await sha(a.email+pw))throw {code:'auth/wrong-password'};return true},
  async logout(){const s=rd();s.session=null;wr(s);fire()},
  async reset(){return true},
  async profile(){const a=acc();return a?{name:a.name,email:a.email,phone:a.phone||'',pinHash:a.pinHash,consent:a.consent}:null},
  async completeProfile({name,pin,phone,consent}){const s=rd();const a=s.accounts.find(x=>x.uid===s.session);a.name=name||a.name;a.phone=phone||a.phone||'';a.pinHash=await sha(a.uid+pin);a.consent={...consent,ts:Date.now()};wr(s)},
  async updateProfile(p){const s=rd();const a=s.accounts.find(x=>x.uid===s.session);if(a){if(p.name!=null)a.name=p.name;if(p.phone!=null)a.phone=p.phone;wr(s)}},
  async checkPin(pin){const a=acc();return !!a&&a.pinHash===await sha(a.uid+pin)},
  async changePin(pin){const s=rd();const a=s.accounts.find(x=>x.uid===s.session);a.pinHash=await sha(a.uid+pin);wr(s)},
  async children(){const s=rd();return s.children.filter(c=>c.uid===s.session)},
  watchChildren(cb){const f=()=>B.children().then(cb);subs.add(f);f();return()=>subs.delete(f)},
  async addChild(c){const s=rd();const id=rid();s.children.push({id,uid:s.session,limitMin:0,stars:{},best:{},prog:{},play:{},totalSecs:0,createdAt:Date.now(),...c});wr(s);return id},
  async updateChild(id,patch){const s=rd();const c=s.children.find(x=>x.id===id);if(c){Object.assign(c,patch);wr(s)}},
  async getChild(id){return rd().children.find(x=>x.id===id)||null},
  watchChild(id,cb){const f=()=>cb(rd().children.find(x=>x.id===id)||null);subs.add(f);f();return()=>subs.delete(f)},
  async deleteChild(id){const s=rd();s.children=s.children.filter(c=>c.id!==id);s.events=s.events.filter(e=>e.cid!==id);wr(s)},
  async addEvent(cid,ev){const s=rd();s.events.push({cid,...ev});if(s.events.length>3000)s.events=s.events.slice(-3000);wr(s)},
  watchEvents(cid,cb,n=50){const f=()=>cb(rd().events.filter(e=>e.cid===cid).sort((a,b)=>b.t-a.t).slice(0,n));subs.add(f);f();return()=>subs.delete(f)},
  async addPlay(cid,day,secs){const s=rd();const c=s.children.find(x=>x.id===cid);if(!c)return;c.play=c.play||{};c.play[day]=(c.play[day]||0)+secs;c.totalSecs=(c.totalSecs||0)+secs;c.lastActive=Date.now();wr(s)},
  supportWatch(cb){const f=()=>{const a=acc();cb(a&&sd()[a.uid]?sd()[a.uid].msgs:[])};subs.add(f);f();return()=>subs.delete(f)},
  async supportSend(text){const a=acc();const o=sd();const th=o[a.uid]||(o[a.uid]={uid:a.uid,name:a.name,email:a.email,msgs:[],unread:0});th.msgs.push({from:'parent',text,t:Date.now()});th.lastAt=Date.now();th.last=text;th.unread=(th.unread||0)+1;if(th.msgs.filter(m=>m.from==='parent').length===1)th.msgs.push({from:'bot',text:'وصلتنا رسالتك! فريق الدعم هيرد عليك هنا في أقرب وقت.',t:Date.now()});sw(o)},
  adminThreads(cb){const f=()=>cb(Object.values(sd()).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0)));subs.add(f);f();return()=>subs.delete(f)},
  adminWatchThread(uid,cb){const f=()=>cb((sd()[uid]||{msgs:[]}).msgs);subs.add(f);f();return()=>subs.delete(f)},
  async adminSend(uid,text){const o=sd();const th=o[uid];if(!th)return;th.msgs.push({from:'admin',text,t:Date.now()});th.lastAt=Date.now();th.last=text;th.unread=0;sw(o)},
  async getConfig(){try{return JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){return {}}},
  watchConfig(cb){const f=()=>B.getConfig().then(cb);subs.add(f);f();return()=>subs.delete(f)},
  async saveConfig(c){localStorage.setItem(CK,JSON.stringify(c));notify()},
  async isAdmin(){return !!acc()},
  async uploadVideo(file,id,onP){if(file.size>2.5*1024*1024)throw {message:'الفيديو كبير. الصق رابط الفيديو بدل الرفع.'};return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no({message:'تعذّرت قراءة الملف'});r.readAsDataURL(file)})},
  async exportAll(){const s=rd();const a=acc();const kids=s.children.filter(c=>c.uid===s.session);return {parent:{name:a.name,email:a.email,phone:a.phone||'',consent:a.consent},children:kids,events:s.events.filter(e=>kids.some(k=>k.id===e.cid))}},
  async deleteAccount(){const s=rd();const uid=s.session;const ids=s.children.filter(c=>c.uid===uid).map(c=>c.id);s.children=s.children.filter(c=>c.uid!==uid);s.events=s.events.filter(e=>!ids.includes(e.cid));s.accounts=s.accounts.filter(a=>a.uid!==uid);s.session=null;wr(s);fire()}
 };
 return B}

/* ---------- Firebase ---------- */
function makeFirebase(){
 let auth,fs,cur=null,prof=null;const authCb=[];
 const P=u=>fs.collection('parents').doc(u),K=u=>P(u).collection('children');
 const U=u=>u?{uid:u.uid,email:u.email,name:u.displayName||''}:null;
 const load=async()=>{const base='https://www.gstatic.com/firebasejs/10.14.1/';
  for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'].concat(CFG.firebase.storageBucket?['firebase-storage-compat.js']:[]))await new Promise((ok,no)=>{const s=document.createElement('script');s.src=base+f;s.onload=ok;s.onerror=()=>no(new Error('تعذّر تحميل Firebase'));document.head.appendChild(s)})};
 const B={mode:'firebase',
  async init(){await load();firebase.initializeApp(CFG.firebase);auth=firebase.auth();fs=firebase.firestore();
   try{await auth.getRedirectResult()}catch(e){DB.redirectError=e}
   await new Promise(r=>{let first=true;auth.onAuthStateChanged(u=>{cur=u;prof=null;if(first){first=false;r()}authCb.forEach(f=>f(U(u)))})})},
  user(){return U(cur)},
  onAuth(cb){authCb.push(cb);cb(U(cur))},
  async register({name,email,password,pin,phone,consent}){const cr=await auth.createUserWithEmailAndPassword(email.trim(),password);await cr.user.updateProfile({displayName:name});
   prof={name,email:email.trim(),phone:phone||'',pinHash:await sha(cr.user.uid+pin),consent:{...consent,ts:Date.now()},createdAt:Date.now()};await P(cr.user.uid).set(prof);return U(cr.user)},
  async login(email,password){const cr=await auth.signInWithEmailAndPassword(email.trim(),password);return U(cr.user)},
  async google(){const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
   try{const cr=await auth.signInWithPopup(pr);return U(cr.user)}catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')&&/^https?:/.test(location.protocol)){await auth.signInWithRedirect(pr);return new Promise(()=>{})}throw e}},
  async logout(){await auth.signOut()},
  async reset(email){await auth.sendPasswordResetEmail(email.trim())},
  async profile(){if(!cur)return null;if(prof)return prof;const d=await P(cur.uid).get();prof=d.exists?d.data():null;return prof},
  async completeProfile({name,pin,phone,consent}){prof={name:name||cur.displayName||'',email:cur.email,phone:phone||'',pinHash:await sha(cur.uid+pin),consent:{...consent,ts:Date.now()},createdAt:Date.now()};await P(cur.uid).set(prof,{merge:true})},
  async updateProfile(p){await P(cur.uid).update(p);if(prof)Object.assign(prof,p)},
  async verifyPassword(pw){const u=cur;if(u.providerData.some(p=>p.providerId==='password')){await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw))}else{await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider())}return true},
  async checkPin(pin){const p=await B.profile();return !!p&&p.pinHash===await sha(cur.uid+pin)},
  async changePin(pin){const h=await sha(cur.uid+pin);await P(cur.uid).update({pinHash:h});if(prof)prof.pinHash=h},
  async children(){const q=await K(cur.uid).get();return q.docs.map(d=>({id:d.id,...d.data()}))},
  watchChildren(cb){return K(cur.uid).onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))))},
  async addChild(c){const r=await K(cur.uid).add({limitMin:0,stars:{},best:{},prog:{},play:{},totalSecs:0,createdAt:Date.now(),...c});return r.id},
  async updateChild(id,patch){await K(cur.uid).doc(id).update(patch)},
  async getChild(id){const d=await K(cur.uid).doc(id).get();return d.exists?{id:d.id,...d.data()}:null},
  watchChild(id,cb){return K(cur.uid).doc(id).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null))},
  async deleteChild(id){const ev=await K(cur.uid).doc(id).collection('events').get();const b=fs.batch();ev.docs.forEach(d=>b.delete(d.ref));b.delete(K(cur.uid).doc(id));await b.commit()},
  async addEvent(cid,ev){await K(cur.uid).doc(cid).collection('events').add(ev)},
  watchEvents(cid,cb,n=50){return K(cur.uid).doc(cid).collection('events').orderBy('t','desc').limit(n).onSnapshot(q=>cb(q.docs.map(d=>d.data())))},
  async addPlay(cid,day,secs){const inc=firebase.firestore.FieldValue.increment;await K(cur.uid).doc(cid).update({['play.'+day]:inc(secs),totalSecs:inc(secs),lastActive:Date.now()})},
  supportWatch(cb){const u=cur.uid;return fs.collection('support').doc(u).collection('messages').orderBy('t').limit(200).onSnapshot(q=>cb(q.docs.map(d=>d.data())))},
  async supportSend(text){const u=cur.uid,ref=fs.collection('support').doc(u),first=(await ref.collection('messages').limit(1).get()).empty;await ref.collection('messages').add({from:'parent',text,t:Date.now()});await ref.set({uid:u,name:cur.displayName||'',email:cur.email,lastAt:Date.now(),last:text,unread:firebase.firestore.FieldValue.increment(1)},{merge:true});if(first)await ref.collection('messages').add({from:'bot',text:'وصلتنا رسالتك! فريق الدعم هيرد عليك هنا في أقرب وقت.',t:Date.now()+1})},
  adminThreads(cb){return fs.collection('support').orderBy('lastAt','desc').limit(60).onSnapshot(q=>cb(q.docs.map(d=>d.data())))},
  adminWatchThread(uid,cb){return fs.collection('support').doc(uid).collection('messages').orderBy('t').limit(300).onSnapshot(q=>cb(q.docs.map(d=>d.data())))},
  async adminSend(uid,text){const ref=fs.collection('support').doc(uid);await ref.collection('messages').add({from:'admin',text,t:Date.now()});await ref.set({lastAt:Date.now(),last:text,unread:0},{merge:true})},
  async getConfig(){const d=await fs.collection('config').doc('app').get();return d.exists?d.data():{}},
  watchConfig(cb){return fs.collection('config').doc('app').onSnapshot(d=>cb(d.exists?d.data():{}),()=>cb({}))},
  async saveConfig(c){await fs.collection('config').doc('app').set(c)},
  async isAdmin(){if(!cur)return false;try{const d=await fs.collection('admins').doc(cur.uid).get();return d.exists}catch(e){return false}},
  async uploadVideo(file,id,onP){if(!firebase.storage)throw {message:'ضيف storageBucket في config.js لتفعيل رفع الفيديو'};const ext=(file.name.split('.').pop()||'mp4').toLowerCase();const ref=firebase.storage().ref('videos/'+id+'-'+Date.now()+'.'+ext);const task=ref.put(file);await new Promise((ok,no)=>task.on('state_changed',s=>onP&&onP(Math.round(s.bytesTransferred/s.totalBytes*100)),no,ok));return await ref.getDownloadURL()},
  async exportAll(){const kids=await B.children();const out={parent:await B.profile(),children:kids,events:[]};for(const k of kids){const q=await K(cur.uid).doc(k.id).collection('events').get();q.docs.forEach(d=>out.events.push({cid:k.id,...d.data()}))}if(out.parent)delete out.parent.pinHash;return out},
  async deleteAccount(){const kids=await B.children();for(const k of kids)await B.deleteChild(k.id);await P(cur.uid).delete();await cur.delete()}
 };
 return B}

const DB={mode:'demo',_b:null,
 async init(){const useFb=CFG.firebase&&CFG.firebase.apiKey&&!/^YOUR_/i.test(CFG.firebase.apiKey);
  let b=null;
  if(useFb){if(location.protocol==='file:')throw Object.assign(new Error('file-protocol'),{code:'file-protocol'});b=makeFirebase();await b.init()}

 closeModal();ov=el('div','ov');let v='';
 const m=el('div','modal pin authf','<h3>'+title+'</h3><div class="pdots" id="pdots"></div><div class="pmsg" id="pmsg"></div><div class="pk" id="pk"></div><p class="alinks"><a id="pf">نسيت الكود؟</a></p>');
 ov.appendChild(m);document.body.appendChild(ov);const dots=$('#pdots',m),msg=$('#pmsg',m);
 const upd=()=>{dots.innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<v.length?'on':'')+'"></i>').join('')};upd();
 const press=async d=>{if(d==='del')v=v.slice(0,-1);else if(v.length<4)v+=d;upd();

 $('#pk',m).innerHTML=['1','2','3','4','5','6','7','8','9','x','0','del'].map(k=>'<button data-k="'+k+'">'+(k==='x'?ic('x'):k==='del'?'مسح':k)+'</button>').join('');

const slug=()=>'g'+Date.now().toString(36);
function login(){
 show('<div class="authbox"><img class="aicon" alt="" src="'+APP_ICON+'"><h1 class="atitle sm">لوحة الإدارة</h1><p class="asub">إدارة الألعاب والمستويات والفيديوهات والدعم الفني.</p>'+fld('البريد الإلكتروني','lEmail','email','dir="ltr"')+fld('كلمة المرور','lPass','password','dir="ltr"')
  +'<div class="aerr hide" id="aerr"></div><button class="big" id="bGo">'+ic('login')+' دخول</button>'+'</div>');
 $('#bGo').onclick=async()=>{authErr('');try{await DB.login($('#lEmail').value,$('#lPass').value);await route()}catch(e){authErr(errMsg(e))}};
}
async function route(){const u=DB.user();if(!u)return login();
 if(!(await DB.isAdmin())){show('<div class="authbox center"><h2 class="atitle sm">الحساب ده مش أدمن</h2><p class="asub">اطلب من صاحب المشروع يضيف حسابك في مجموعة <b>admins</b>.</p><button class="big sm" id="bOut">تسجيل خروج</button></div>');$('#bOut').onclick=out;return}
 DB.watchConfig(c=>{CONFIG=Object.assign({games:{},custom:[]},c||{});if(!EDIT&&!ov)main()});main()}
async function out(){try{await DB.logout()}catch(e){}login()}
const tabsA=[['games','الألعاب الحالية','gamepad'],['custom','ألعاب جديدة','plus'],['inbox','الدعم الفني','phone']];
function main(){
 show('<div class="ptop"><h2>لوحة الإدارة</h2><button class="gb" id="aOut">'+ic('x')+' خروج</button></div><div class="ltabs" id="tb">'+tabsA.map(([k,t,i])=>'<button data-t="'+k+'" class="'+(k===TABA?'on':'')+'">'+ic(i)+' '+t+'</button>').join('')+'</div><div id="ab"></div>');
 $('#aOut').onclick=out;$('#tb').onclick=e=>{const b=e.target.closest('button[data-t]');if(b){TABA=b.dataset.t;EDIT=null;main()}};
 if(TABA==='games')tabGames();else if(TABA==='custom')tabCustom();else tabInbox()}
const saveCfg=async()=>{try{await DB.saveConfig(CONFIG);toast('اتحفظ ونزل لكل التطبيقات')}catch(e){toast(errMsg(e))}};
const iconOpts=sel=>Object.keys(ICONS).filter(k=>!/^(arrow|turn|theme|exit|c-|sq-)/.test(k)).map(k=>'<option value="'+k+'"'+(k===sel?' selected':'')+'>'+k+'</option>').join('');
const videoField=(id,url)=>'<div class="fl"><span>فيديو شرح طريقة اللعب</span><input class="in vurl" data-id="'+id+'" dir="ltr" placeholder="رابط الفيديو (mp4/webm) أو ارفع ملف" value="'+escH(url||'')+'"><div class="vrow"><label class="gb upl">'+ic('video')+' رفع فيديو<input type="file" accept="video/*" class="vfile" data-id="'+id+'" hidden></label><span class="vprog" data-id="'+id+'"></span></div></div>';
async function wireVideos(root,onUrl){root.querySelectorAll('.vfile').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const pr=root.querySelector('.vprog[data-id="'+inp.dataset.id+'"]');
 try{pr.textContent='جاري الرفع…';const url=await DB.uploadVideo(f,inp.dataset.id,p=>{pr.textContent=p+'%'});root.querySelector('.vurl[data-id="'+inp.dataset.id+'"]').value=url;pr.textContent='تم الرفع';onUrl&&onUrl(inp.dataset.id,url)}catch(e){pr.textContent='';toast(errMsg(e))}})}
/* ---- تبويب الألعاب الجاهزة ---- */
function tabGames(){
 const G=CONFIG.games||(CONFIG.games={});
 $('#ab').innerHTML='<p class="asub">اقفل لعبة لكل المستخدمين، غيّر الاسم والوصف والترتيب، وارفع فيديو شرح لكل لعبة.</p>'+WORLDS.map(w=>'<h3 class="sec">'+ic(w.ic)+' '+w.name+'</h3>'+CATALOG.filter(g=>g.world===w.id).map(g=>{const o=G[g.id]||{};return '<div class="acard" data-id="'+g.id+'"><div class="ahead"><span class="gi">'+ic(g.ic)+'</span><b>'+escH(g.title)+'</b><small>('+g.id+')</small><button class="sw'+(o.enabled===false?' on':'')+'" data-a="tog">'+(o.enabled===false?'متوقفة':'شغّالة')+'</button></div>'
  +'<div class="agrid">'+fld('اسم بديل (اختياري)','t_'+g.id,'text','value="'+escH(o.title||'')+'" data-k="title"')+fld('وصف بديل','d_'+g.id,'text','value="'+escH(o.desc||'')+'" data-k="desc"')+fld('الترتيب','o_'+g.id,'number','value="'+(o.order==null?'':o.order)+'" data-k="order"')+'</div>'+videoField(g.id,o.video)+'</div>'}).join('')).join('')+'<button class="big" id="aSave">'+ic('check')+' حفظ التغييرات</button>';
 const ab=$('#ab');
 ab.onclick=e=>{const b=e.target.closest('[data-a="tog"]');if(!b)return;const id=b.closest('.acard').dataset.id;const o=G[id]||(G[id]={});o.enabled=o.enabled===false?true:false;b.classList.toggle('on',o.enabled===false);b.textContent=o.enabled===false?'متوقفة':'شغّالة'};
 wireVideos(ab);
 $('#aSave').onclick=()=>{ab.querySelectorAll('.acard').forEach(c=>{const id=c.dataset.id,o=G[id]||(G[id]={});c.querySelectorAll('input[data-k]').forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(k==='order')o.order=v===''?null:+v;else o[k]=v});o.video=c.querySelector('.vurl').value.trim()});saveCfg()}}
/* ---- ألعاب جديدة ---- */
const FMT={quiz:'سطر لكل سؤال:\nالسؤال | خيار1 ; خيار2 ; خيار3 | رقم الإجابة الصح | أيقونة (اختياري)\nمثال: كام رجل للقطة؟ | 2 ; 4 ; 6 | 2 | cat',typing:'سطر لكل كلمة (إنجليزي):\ncat | cat\n(الكلمة | اسم أيقونة اختياري)',order:'كل سيناريو منفصل بسطر فاضي. أول سطر = العنوان، وبعده الخطوات بالترتيب الصح:\nغسل الأسنان\nحط المعجون\nنظّف الأسنان\nاشطف',memory:'سطر لكل زوج:\nA | B   (نص أو اسم أيقونة)\nمثال: cat | قطة'};
const TYPES={quiz:'اختيار من متعدد',typing:'كتابة كلمات',order:'ترتيب خطوات',memory:'ذاكرة (أزواج)'};
const itemsToText=(t,items)=>(items||[]).map(x=>t==='quiz'?x.q+' | '+x.opts.join(' ; ')+' | '+(x.a+1)+(x.img?' | '+x.img:''):t==='typing'?x.w+(x.img?' | '+x.img:''):t==='order'?x.t+'\n'+x.steps.join('\n'):x[0]+' | '+x[1]).join(t==='order'?'\n\n':'\n');
function parseItems(t,txt){const errs=[];let items=[];const L=txt.split('\n').map(x=>x.trim());
 if(t==='order'){txt.split(/\n\s*\n/).map(b=>b.trim().split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).forEach((b,i)=>{if(b.length<3)errs.push('السيناريو '+(i+1)+': محتاج عنوان + خطوتين على الأقل');else items.push({t:b[0],steps:b.slice(1)})})}
 else L.filter(Boolean).forEach((ln,i)=>{const p=ln.split('|').map(x=>x.trim());
  if(t==='quiz'){const opts=(p[1]||'').split(';').map(x=>x.trim()).filter(Boolean),a=parseInt(p[2],10)-1;if(!p[0]||opts.length<2||opts.length>5||!(a>=0&&a<opts.length))errs.push('سطر '+(i+1)+': صيغة السؤال غلط');else items.push({q:p[0],opts,a,img:ICONS[p[3]]?p[3]:''})}
  else if(t==='typing'){const w=(p[0]||'').toLowerCase().replace(/[^a-z ]/g,'').trim();if(!w)errs.push('سطر '+(i+1)+': الكلمة لازم حروف إنجليزي');else items.push({w,img:ICONS[p[1]]?p[1]:''})}
  else{if(!p[0]||!p[1])errs.push('سطر '+(i+1)+': لازم زوج A | B');else items.push([p[0],p[1]])}});
 return {items,errs}}
function tabCustom(){
 const C=CONFIG.custom||(CONFIG.custom=[]);
 if(EDIT){return editor()}
 $('#ab').innerHTML='<button class="big alt" id="aNew">'+ic('plus')+' إضافة لعبة جديدة</button>'+(C.length?C.map(d=>'<div class="acard" data-id="'+d.id+'"><div class="ahead"><span class="gi">'+ic(ICONS[d.ic]?d.ic:'puzzle')+'</span><b>'+escH(d.title)+'</b><small>'+TYPES[d.type]+' • '+(d.levels||[]).length+' مستوى</small><button class="sw'+(d.enabled===false?' on':'')+'" data-a="tog">'+(d.enabled===false?'متوقفة':'شغّالة')+'</button></div><div class="runrow"><button class="gb" data-a="edit">'+ic('edit')+' تعديل</button><button class="gb" data-a="del">'+ic('trash')+' حذف</button></div></div>').join(''):'<p class="asub">لسه مفيش ألعاب جديدة. أضف لعبتك الأولى!</p>');
 $('#aNew').onclick=()=>{EDIT={id:slug(),title:'',desc:'',ic:'puzzle',world:'code',type:'quiz',video:'',help:[],enabled:true,levels:[{name:'سهل',items:[]}],_new:true};tabCustom()};
 $('#ab').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=b.closest('.acard'),d=C.find(x=>x.id===c.dataset.id);
  if(b.dataset.a==='tog'){d.enabled=d.enabled===false;saveCfg();main()}else if(b.dataset.a==='edit'){EDIT=JSON.parse(JSON.stringify(d));tabCustom()}
  else if(b.dataset.a==='del')modal('<h3>حذف اللعبة؟</h3><p>'+escH(d.title)+'</p>',[['حذف',()=>{CONFIG.custom=C.filter(x=>x.id!==d.id);saveCfg();main()},'sm dng'],['إلغاء',null,'sm']])}}
function editor(){
 const d=EDIT;
 $('#ab').innerHTML='<div class="authbox ed">'+fld('اسم اللعبة','eT','text','maxlength="40" value="'+escH(d.title)+'"')+fld('وصف قصير','eD','text','maxlength="70" value="'+escH(d.desc||'')+'"')
  +'<label class="fl"><span>الأيقونة</span><select class="in" id="eI">'+iconOpts(d.ic)+'</select></label><label class="fl"><span>العالم</span><select class="in" id="eW">'+WORLDS.map(w=>'<option value="'+w.id+'"'+(w.id===d.world?' selected':'')+'>'+w.name+'</option>').join('')+'</select></label>'
  +'<label class="fl"><span>نوع اللعبة</span><select class="in" id="eY">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'"'+(k===d.type?' selected':'')+'>'+v+'</option>').join('')+'</select></label>'
  +'<label class="fl"><span>شرح طريقة اللعب (سطر لكل نقطة)</span><textarea class="in" id="eH" rows="3">'+escH((d.help||[]).join('\n'))+'</textarea></label>'+videoField('ed_'+d.id,d.video)
  +'<h3 class="sec">المستويات (من 1 إلى 8)</h3><div id="lvls"></div><button class="big sm" id="eAddL">'+ic('plus')+' إضافة مستوى</button><div class="aerr hide" id="aerr"></div><button class="big" id="eSave">'+ic('check')+' حفظ اللعبة</button><button class="big sm" id="eCancel">إلغاء</button></div>';
 const LN=['سهل','متوسط','صعب','خبير','أسطورة','عبقري','محترف','بطل المدينة'];
 const drawL=()=>{$('#lvls').innerHTML=d.levels.map((l,i)=>'<div class="lvbox"><div class="ahead"><b>المستوى '+(i+1)+'</b><input class="in lname" data-i="'+i+'" value="'+escH(l.name||LN[i])+'" style="max-width:140px">'+(d.levels.length>1?'<button class="gb" data-del="'+i+'">'+ic('trash')+'</button>':'')+'</div><textarea class="in litems" data-i="'+i+'" rows="7" dir="auto" placeholder="'+escH(FMT[d.type])+'">'+escH(l._txt!=null?l._txt:itemsToText(d.type,l.items))+'</textarea></div>').join('')+'<p class="anote" style="white-space:pre-line">'+escH(FMT[d.type])+'</p>'};
 const sync=()=>{d.title=$('#eT').value.trim();d.desc=$('#eD').value.trim();d.ic=$('#eI').value;d.world=$('#eW').value;d.help=$('#eH').value.split('\n').map(x=>x.trim()).filter(Boolean);d.video=$('.vurl').value.trim();
  document.querySelectorAll('.lname').forEach(i=>d.levels[+i.dataset.i].name=i.value.trim());document.querySelectorAll('.litems').forEach(i=>d.levels[+i.dataset.i]._txt=i.value)};
 drawL();wireVideos($('#ab'));
 $('#eY').onchange=()=>{sync();d.type=$('#eY').value;d.levels.forEach(l=>{l.items=[];l._txt=''});drawL()};
 $('#eAddL').onclick=()=>{sync();if(d.levels.length>=8)return toast('الحد الأقصى 8 مستويات');d.levels.push({name:LN[d.levels.length],items:[]});drawL()};
 $('#lvls').onclick=e=>{const b=e.target.closest('[data-del]');if(b){sync();d.levels.splice(+b.dataset.del,1);drawL()}};
 $('#eCancel').onclick=()=>{EDIT=null;main()};
 $('#eSave').onclick=()=>{sync();if(d.title.length<2)return authErr('اكتب اسم اللعبة');let all=[];
  for(let i=0;i<d.levels.length;i++){const l=d.levels[i];const r=parseItems(d.type,l._txt!=null?l._txt:itemsToText(d.type,l.items));if(r.errs.length)return authErr('المستوى '+(i+1)+' — '+r.errs[0]);const min=d.type==='memory'?3:d.type==='order'?1:3;if(r.items.length<min)return authErr('المستوى '+(i+1)+': محتاج على الأقل '+min+' عناصر');l.items=r.items;delete l._txt}
  delete d._new;const C=CONFIG.custom||(CONFIG.custom=[]);const k=C.findIndex(x=>x.id===d.id);if(k>=0)C[k]=d;else C.push(d);EDIT=null;saveCfg();main()}}
/* ---- صندوق الدعم الفني ---- */
function tabInbox(){
 $('#ab').innerHTML='<div class="inbox"><div id="thl" class="thl"></div><div id="thv" class="thv"><p class="asub">اختار محادثة.</p></div></div>';
 let cur=null,unsubT=null;
 unwA.push(DB.adminThreads(ts=>{$('#thl').innerHTML=ts.length?ts.map(t=>'<button class="th'+(t.uid===cur?' on':'')+'" data-u="'+t.uid+'"><b>'+escH(t.name||t.email||t.uid)+'</b><small>'+escH((t.last||'').slice(0,40))+'</small>'+(t.unread?'<i>'+t.unread+'</i>':'')+'</button>').join(''):'<p class="asub">مفيش رسائل.</p>'}));
 $('#thl').onclick=e=>{const b=e.target.closest('.th');if(!b)return;cur=b.dataset.u;if(unsubT)unsubT();
  $('#thv').innerHTML='<div class="cmsgs" id="am"></div><div class="cin"><input id="ai" class="in" placeholder="اكتب الرد…"><button class="csend" id="as">'+ic('next')+'</button></div>';
  unsubT=DB.adminWatchThread(cur,ms=>{const box=$('#am');if(!box)return;box.innerHTML=ms.map(m=>'<div class="cb '+(m.from==='admin'?'me':'them')+'"><span>'+escH(m.text)+'</span></div>').join('');box.scrollTop=box.scrollHeight});unwA.push(()=>unsubT&&unsubT());
  const send=async()=>{const i=$('#ai'),v=i.value.trim();if(!v)return;i.value='';await DB.adminSend(cur,v)};$('#as').onclick=send;$('#ai').onkeydown=e=>{if(e.key==='Enter')send()}}}
async function boot(){show('<div class="authbox center"><img class="aicon" alt="" src="'+APP_ICON+'"><p class="asub">جاري التحميل…</p></div>');
 try{await DB.init()}catch(e){console.warn(e);return show('<div class="authbox center"><h2 class="atitle sm">مش قادرين نوصل بالإنترنت</h2><p class="asub">'+escH(errMsg(e))+'</p><button class="big" onclick="location.reload()">جرّب تاني</button></div>')}
 await route()}


boot();
</script>
</body>
</html>
