 fill="#fff" stroke="${f}" stroke-width="3.5"/><path d="M14 24h36M14 34h28M14 44h18" stroke="#1fb5ab" stroke-width="4.5" stroke-linecap="round"/>`,math:'<rect x="4" y="9" width="56" height="46" rx="11" fill="#6c5ce7"/><path d="M22 20v24M10 32h24M42 32h14" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>',traffic:'<rect x="17" y="3" width="30" height="58" rx="11" fill="#3b2a63"/><circle cx="32" cy="17" r="7.5" fill="#ff4d4d"/><circle cx="32" cy="32" r="7.5" fill="#ffd93d"/><circle cx="32" cy="47" r="7.5" fill="#22c55e"/>',steps:'<path d="M5 57h15V43h15V29h15V15h9v42z" fill="#1fb5ab" stroke="#138077" stroke-width="3" stroke-linejoin="round"/>',sort:'<path d="M5 32h24l-3 26H8z" fill="#ff6b9d"/><path d="M35 32h24l-3 26H38z" fill="#4dabf7"/><circle cx="32" cy="14" r="9" fill="#ffd93d" stroke="#f0a500" stroke-width="3"/><path d="M32 25v3" stroke="#f0a500" stroke-width="3"/>',shield:'<path d="M32 3l24 8v18c0 15-10 26-24 31C18 55 8 44 8 29V11z" fill="currentColor"/><path d="M21 31l8 8 15-17" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',google:'<circle cx="32" cy="32" r="28" fill="#fff" stroke="#dadce0" stroke-width="3"/><text x="32" y="45" text-anchor="middle" font-size="38" font-weight="900" fill="#4285f4" font-family="Arial,Helvetica,sans-serif">G</text>',video:'<rect x="4" y="12" width="56" height="40" rx="9" fill="#ff4d79"/><path d="M26 22l16 10-16 10z" fill="#fff"/>',plus:'<path d="M32 10v44M10 32h44" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>',chart:'<rect x="8" y="34" width="11" height="22" rx="3" fill="#1fb5ab"/><rect x="26" y="20" width="11" height="36" rx="3" fill="#6c5ce7"/><rect x="44" y="8" width="11" height="48" rx="3" fill="#ff6b9d"/>',phone:'<rect x="16" y="3" width="32" height="58" rx="8" fill="currentColor"/><rect x="21" y="10" width="22" height="38" rx="3" fill="#fff" opacity=".9"/><circle cx="32" cy="54" r="3" fill="#fff"/>',"sq-red":'<rect x="8" y="8" width="48" height="48" rx="8" fill="#ff4d4d"/><rect x="14" y="13" width="14" height="7" rx="3" fill="#fff" opacity=".35"/>',"sq-blue":'<rect x="8" y="8" width="48" height="48" rx="8" fill="#3b82f6"/><rect x="14" y="13" width="14" height="7" rx="3" fill="#fff" opacity=".35"/>',edit:'<path d="M9 55l4-15L41 12l11 11L24 51z" fill="currentColor"/><path d="M41 12l6-6 11 11-6 6z" fill="currentColor" opacity=".6"/>',rect:'<rect x="3" y="15" width="58" height="34" rx="6" fill="#1fb5ab" stroke="#138077" stroke-width="3"/>',hex:'<path d="M32 4l25 14v28L32 60 7 46V18z" fill="#f39c12" stroke="#b9770e" stroke-width="3" stroke-linejoin="round"/>',diamond:'<path d="M32 4l26 28-26 28L6 32z" fill="#4dd0e1" stroke="#0e8fa3" stroke-width="3" stroke-linejoin="round"/>',triangle:'<path d="M32 6l27 50H5z" fill="#ff6b9d" stroke="#d6336c" stroke-width="3" stroke-linejoin="round"/>',square:'<rect x="8" y="8" width="48" height="48" rx="8" fill="#1fb5ab" stroke="#138077" stroke-width="3"/>'},y=(e,t)=>'<svg class="ic'+(t?" "+t:"")+'" viewBox="0 0 64 64" aria-hidden="true">'+(O[e]||"")+"</svg>",_={};function Ae(e){if(!_[e]){const t=new Image;t.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">'+(O[e]||"")+"</svg>"),_[e]=t}return _[e]}["apple","star","gem","bomb","basket","comet","rocket","mouse","cheese"].forEach(Ae);const ue="2026-10-10",X={terms:{t:"شروط الاستخدام",ic:"book",s:[["1. التعريفات",["• «التطبيق»: منصة «مدينة المبرمج الصغير» بكل نسخها (نسخة الطفل، نسخة اللابتوب، تطبيق ولي الأمر، والموقع).","• «الجهة المشغّلة»: {publisher}.","• «ولي الأمر»: الأب أو الأم أو الوصي القانوني البالغ (18 سنة فأكثر) الذي يُنشئ الحساب ويتحمّل مسؤوليته.","• «الطفل»: الشخص الأقل من 18 سنة الذي يلعب عبر ملف أنشأه ولي أمره.","• «الملف»: ملف اللعب الخاص بطفل داخل حساب ولي الأمر."]],["2. قبول الشروط",["باستخدامك التطبيق أو إنشاء حساب أو الضغط على «أوافق» فأنت تقرّ بأنك قرأت هذه الشروط وسياسة الخصوصية وسياسة حماية الطفل وفهمتها ووافقت عليها.","إذا لم توافق على أي بند فيرجى عدم إنشاء حساب أو استخدام التطبيق."]],["3. من يحق له إنشاء حساب",["• الحساب لا يُنشئه إلا ولي أمر بالغ (18 سنة فأكثر) أو من له سلطة قانونية على الطفل، ويقدّم رقم هاتفه وبريده وكوداً سرياً.","• التطبيق مصمَّم للأطفال من 5 إلى 13 سنة تقريباً، ولا يحق للطفل إنشاء حساب بنفسه.","• يجب أن تكون البيانات التي يقدّمها ولي الأمر صحيحة وكاملة ومحدَّثة.","• يجوز اللعب بوضع «بدون حساب» على الجهاز نفسه، وفي هذه الحالة يُحفظ التقدّم على الجهاز فقط."]],["4. الحساب والأمان",["• ولي الأمر مسؤول عن سرّية بريده وكلمة مروره والكود السري، وعن كل نشاط يتم عبر حسابه.","• يجب إبلاغنا فوراً إذا اشتبهت في دخول غير مصرّح به.","• الكود السري (PIN) يمنع الطفل من تغيير الإعدادات أو الخروج من وضع الطفل أو تجاوز وقت اللعب، ويُطلب أيضاً لفتح تطبيق متابعة الطفل.","• من حقنا تعليق الحساب مؤقتاً لحمايته إذا ظهر نشاط مشبوه."]],["5. مسؤولية ولي الأمر",["• الإشراف على استخدام الطفل للتطبيق وتحديد أوقات اللعب المناسبة.","• اختيار اسم مستعار للطفل لا يكشف اسمه الحقيقي أو مدرسته أو عنوانه.","• عدم مشاركة بيانات الدخول مع الطفل أو مع الغير.","• مراجعة سياسة الخصوصية وسياسة حماية الطفل والموافقة عليهما بوصفه صاحب الصلاحية على بيانات الطفل."]],["6. الاستخدام المقبول",["يلتزم المستخدم بما يلي، ويُمنع:","• محاولة اختراق التطبيق أو قاعدة بياناته أو تجاوز إجراءات الحماية أو فحص الثغرات دون إذن مكتوب.","• نسخ الكود أو الأيقونات أو المحتوى أو إعادة بيعه أو نشره دون إذن.","• استخدام برامج آلية للتلاعب بالنجوم أو النتائج.","• إدخال معلومات مسيئة أو مضللة أو تخص غيرك في أي حقل (مثل الاسم المستعار).","• استخدام التطبيق لأي غرض مخالف للقانون."]],["7. المحتوى التعليمي وحدود الضمان",["• التطبيق وسيلة تعليمية ترفيهية، ولا يُعدّ بديلاً عن التعليم المدرسي أو الإشراف التربوي.","• النجوم والمستويات والألقاب مؤشرات تحفيزية فقط، وليست تقييماً أكاديمياً رسمياً.","• نبذل جهدنا لجودة المحتوى وخلوّه من الأخطاء، لكننا لا نضمن خلوّه التام منها."]],["8. الملكية الفكرية",["• جميع الحقوق في التطبيق (الكود والتصميم والأيقونات والشخصية «كودو» والنصوص والألعاب) محفوظة لـ{owner}، ولا يجوز نسخها أو إعادة نشرها دون إذن كتابي.","• نمنحك ترخيصاً محدوداً وغير حصري وغير قابل للتحويل لاستخدام التطبيق لأغراض شخصية وتعليمية غير تجارية.","• الخطوط المستخدمة تخضع لتراخيص أصحابها."]],["9. التوفّر والتحديثات والمحتوى",["• تضيف الإدارة من وقت لآخر ألعاباً ومستويات ومقاطع فيديو شرح لطريقة اللعب، ويحق لها تعديلها أو إيقافها.","• قد يتوقف التطبيق أو بعض خصائصه مؤقتاً للصيانة أو لظروف خارجة عن إرادتنا.","• قد نضيف ألعاباً أو نعدّل مستويات أو نزيل ميزات، وسنعلن التغييرات الجوهرية داخل التطبيق.","• ميزات المزامنة والمتابعة تحتاج اتصالاً بالإنترنت، أما اللعب نفسه فيعمل دون اتصال."]],["10. حدود المسؤولية",["• يُقدَّم التطبيق «كما هو» دون ضمانات صريحة أو ضمنية بقدر ما يسمح به القانون.","• لا نتحمّل مسؤولية أي ضرر غير مباشر أو فقدان بيانات ناتج عن عطل الجهاز أو الإنترنت أو عن مشاركة ولي الأمر بيانات دخوله.","• لا يحدّ هذا البند من مسؤوليتنا في الحالات التي لا يجيز القانون الإعفاء منها."]],["11. إيقاف الحساب وحذفه",["• يحق لولي الأمر حذف ملف طفل أو حذف الحساب بالكامل في أي وقت من تطبيق ولي الأمر، وسيتم حذف البيانات المرتبطة به.","• يحق لنا إيقاف أي حساب يخالف هذه الشروط، مع إخطار ولي الأمر متى أمكن."]],["12. التغييرات على الشروط",["قد نحدّث هذه الشروط من وقت لآخر. عند وجود تغيير جوهري سنطلب موافقة ولي الأمر من جديد قبل متابعة الاستخدام. استمرار الاستخدام بعد الإخطار يعني الموافقة على النسخة المحدّثة."]],["13. القانون الواجب التطبيق",["تخضع هذه الشروط لقوانين جمهورية مصر العربية، وتختص محاكمها بالنظر في أي نزاع، مع عدم الإخلال بحقوق المستهلك وحقوق حماية الطفل المقررة بقوانين بلد إقامتك."]],["14. التواصل",["لأي استفسار أو شكوى: {email}"]]]},privacy:{t:"سياسة الخصوصية",ic:"lock",s:[["1. مقدّمة",["نحن في {publisher} نحترم خصوصية الأطفال وأولياء الأمور. توضّح هذه السياسة أي بيانات نجمعها، ولماذا، وكيف نحميها، وما حقوقك. وهي مكتوبة بما يتوافق مع قانون حماية البيانات الشخصية المصري رقم 151 لسنة 2020، ومع مبادئ قانون حماية خصوصية الأطفال على الإنترنت الأمريكي (COPPA) واللائحة الأوروبية العامة لحماية البيانات (GDPR) بخصوص بيانات الأطفال."]],["2. الجهة المسؤولة عن البيانات",["{publisher} — للتواصل: {email}"]],["3. البيانات التي نجمعها من ولي الأمر",["• الاسم (كما يكتبه ولي الأمر) والبريد الإلكتروني ورقم الهاتف (لتأمين الحساب والتواصل مع ولي الأمر عند الحاجة، ولا يظهر للأطفال).","• معرّف الحساب (UID) الذي ينشئه نظام تسجيل الدخول. كلمة المرور لا نراها ولا نخزّنها نصاً، وتُدار عبر خدمة تسجيل الدخول الآمنة.","• بصمة مشفّرة (Hash) للكود السري (PIN)، وليس الكود نفسه.","• سجل الموافقات: نوع الموافقة، رقم نسخة الشروط، وتاريخ ووقت الموافقة."]],["4. البيانات التي نجمعها عن الطفل (الحد الأدنى فقط)",["• اسم مستعار (يُنصح ألا يكون الاسم الحقيقي).","• سنة الميلاد فقط (لتحديد الفئة العمرية).","• الشخصية (الأيقونة) المختارة.","• بيانات اللعب: النجوم والمستويات والنتائج وتقدّم المراحل وعدد أيام اللعب المتتالية.","• سجل نشاط مختصر: اسم اللعبة، المستوى، النتيجة، مدة اللعب، والتاريخ.","• مدة اللعب اليومية وحدّ الوقت الذي يضعه ولي الأمر."]],["5. بيانات لا نجمعها إطلاقاً",["• الاسم الكامل للطفل أو صورته أو صوته أو فيديو له.","• الموقع الجغرافي أو العنوان أو اسم المدرسة.","• جهات الاتصال أو الرسائل أو الميكروفون أو الكاميرا.","• معرّفات الإعلانات أو بيانات التتبع لأغراض تسويقية.","• لا توجد دردشة ولا تعليقات ولا ميزات تواصل بين الأطفال أو مع الغرباء.","• لا توجد عمليات شراء داخل التطبيق ولا إعلانات."]],["6. أغراض استخدام البيانات",["• تشغيل الحساب وحفظ تقدّم الطفل ومزامنته بين الأجهزة.","• عرض تقارير المتابعة لولي الأمر في تطبيق ولي الأمر.","• تطبيق حدود وقت اللعب التي يحدّدها ولي الأمر.","• تحسين الألعاب والمستويات اعتماداً على إحصاءات مجمّعة لا تحدّد هوية الطفل.","• حماية الحسابات ومنع إساءة الاستخدام.","لا نستخدم بيانات الأطفال في الإعلانات أو بناء ملفات تسويقية، ولا نبيعها ولا نؤجّرها."]],["7. الأساس القانوني: موافقة ولي الأمر",["نعالج بيانات الطفل بناءً على موافقة صريحة ومسبقة من ولي أمره عند إنشاء الحساب، ويمكنه سحبها في أي وقت بحذف ملف الطفل أو الحساب. لا نجمع بيانات أي طفل قبل هذه الموافقة (باستثناء وضع «بدون حساب» الذي يبقى على الجهاز فقط)."]],["8. مشاركة البيانات",["لا نشارك البيانات إلا مع مزوّدي خدمات يعالجونها نيابةً عنا وبما يلزم لتشغيل التطبيق فقط:","• Google Firebase (تسجيل الدخول وقاعدة البيانات والاستضافة)، وهم ملتزمون باتفاقيات معالجة بيانات.","• جهات رسمية إذا ألزمنا القانون بذلك بطلب قانوني صحيح.","لا نشارك أي بيانات مع معلنين أو وسطاء بيانات أو شبكات تواصل."]],["9. نقل البيانات خارج بلدك",["قد تُخزَّن البيانات على خوادم في دول أخرى يوفرها مزوّد الخدمة السحابية. نتخذ الضمانات التعاقدية والتقنية المناسبة لحماية البيانات أثناء النقل والتخزين."]],["10. مدة الاحتفاظ بالبيانات",["• بيانات الحساب والأطفال: طوال مدة بقاء الحساب نشطاً.","• عند حذف ملف طفل أو الحساب: تُحذف البيانات المرتبطة به من قاعدة البيانات الحيّة فوراً تقريباً، ومن النسخ الاحتياطية خلال مدة أقصاها 30 يوماً.","• الحسابات غير النشطة لأكثر من 24 شهراً قد تُحذف بعد إشعار ولي الأمر.","• سجل الموافقات قد نحتفظ به المدة التي يلزمها القانون لإثبات الموافقة."]],["11. أمان البيانات",["• تشفير الاتصال (HTTPS/TLS) أثناء نقل البيانات.","• قواعد وصول تمنع أي حساب من قراءة بيانات حساب آخر، وتمنع تعديل محتوى الألعاب إلا للإدارة.","• كود سري (PIN) لحماية إعدادات ولي الأمر داخل نسخة الطفل وتطبيق المتابعة.","• تقليل البيانات المخزّنة إلى الحد الأدنى اللازم.","• لا يوجد نظام آمن بنسبة 100%، ونلتزم بإبلاغ ولي الأمر والجهات المختصة عند وقوع اختراق يؤثر على بياناته وفق القانون."]],["12. حقوق ولي الأمر والطفل",["يحق لولي الأمر، نيابةً عن الطفل ولنفسه:","• الاطلاع على البيانات المحفوظة (من تطبيق ولي الأمر).","• تصحيح البيانات (الاسم المستعار، سنة الميلاد، الشخصية).","• تصدير نسخة من البيانات بصيغة JSON.","• حذف ملف الطفل أو الحساب بالكامل.","• سحب الموافقة أو الاعتراض على المعالجة في أي وقت.","• تقديم شكوى إلى الجهة المختصة بحماية البيانات الشخصية في بلده.","لممارسة أي حق عبر البريد: {email} وسنردّ خلال 30 يوماً."]],["13. التخزين المحلي (Local Storage) والكوكيز",["يستخدم التطبيق التخزين المحلي في جهازك لحفظ التقدّم وإعدادات الصوت والمظهر وحالة الدخول. لا نستخدم كوكيز إعلانية ولا أدوات تحليل تتبّع الأفراد."]],["14. خدمات وموارد خارجية",["• تسجيل الدخول بجوجل اختياري لولي الأمر فقط، ولا يظهر للطفل.","• قد تُحمَّل الخطوط من خادم خارجي إذا لم تكن محفوظة داخل التطبيق، وفي هذه الحالة قد يرى ذلك الخادم عنوان الاتصال (IP) فقط.","• لا توجد روابط خارجية يمكن للطفل الوصول إليها من داخل التطبيق."]],["15. خصوصية الأطفال",["• لا نطلب من الطفل أي معلومة شخصية تتجاوز الاسم المستعار وسنة الميلاد.","• إذا علمنا أننا جمعنا بيانات طفل دون موافقة ولي أمره فسنحذفها دون تأخير.","• وصول ولي الأمر لبيانات طفله يتم دائماً عبر حسابه المحمي."]],["16. تغيير هذه السياسة",["قد نحدّث السياسة، وسنعلمك داخل التطبيق بالتغييرات الجوهرية ونطلب موافقتك من جديد عند الحاجة. تاريخ آخر تحديث: {version}."]],["17. التواصل",["أسئلة الخصوصية والشكاوى: {email}"]]]},child:{t:"سياسة حماية الطفل",ic:"shield",s:[["1. التزامنا",["مصلحة الطفل الفضلى هي الأساس في كل قرار تصميم. نلتزم بتوفير بيئة لعب وتعلّم آمنة ومناسبة للعمر، بما يتوافق مع مبادئ قانون الطفل المصري رقم 12 لسنة 1996 وتعديلاته واتفاقية حقوق الطفل."]],["2. بيئة آمنة بالتصميم",["• لا دردشة، ولا رسائل، ولا تعليقات، ولا ملفات شخصية عامة، ولا تواصل بين الأطفال أو مع أي غريب.","• لا إعلانات ولا عمليات شراء داخل التطبيق ولا مكافآت مالية.","• لا توجد روابط خارجية في نسخة الطفل.","• لا يطلب التطبيق صوراً ولا موقعاً ولا ميكروفوناً ولا كاميرا.","• لا يوجد محتوى مستخدمين، فكل محتوى الألعاب أعدّه فريقنا."]],["3. ملاءمة المحتوى للعمر",["• جميع الألعاب تعليمية ومرحة (ماوس، كيبورد، منطق، برمجة) بلا عنف ولا ألفاظ سيئة ولا صور مخيفة.","• الصور كرتونية بسيطة وآمنة، والنصوص باللغة العربية الواضحة مع كلمات إنجليزية تعليمية بسيطة.","• مستويات الصعوبة تتدرج (سهل، متوسط، صعب) حتى لا يشعر الطفل بالإحباط."]],["4. الموافقة الأبوية الموثّقة",["• لا يُنشأ ملف لطفل إلا بعد إنشاء حساب ولي أمر بالغ والموافقة صراحةً على الشروط والخصوصية وهذه السياسة.","• نحتفظ بسجل موافقة يتضمن نوع الموافقة ونسخة النص وتاريخها.","• يستطيع ولي الأمر سحب الموافقة بحذف الملف أو الحساب في أي لحظة."]],["5. تقليل البيانات",["نجمع أقل قدر ممكن: اسم مستعار، سنة ميلاد، شخصية، وتقدّم اللعب. ننصح بشدة بعدم استخدام الاسم الكامل للطفل. التفاصيل الكاملة في سياسة الخصوصية."]],["6. بوابة ولي الأمر والكود السري",["• نسخة اللابتوب تمنع لقطات الشاشة وتسجيل الشاشة أثناء اللعب لحماية خصوصية الطفل.","• كل الإعدادات (تبديل الطفل، الحسابات، حدود الوقت، الخروج) محمية بكود سري من 4 أرقام يختاره ولي الأمر عند التسجيل، ويكتبه أيضاً لفتح تطبيق المتابعة.","• تسجيل الدخول والتسجيل وروابط الشروط للكبار فقط.","• ننصح بعدم استخدام تاريخ ميلاد الطفل أو أرقام سهلة (1234) كالكود السري."]],["7. أدوات ولي الأمر للمتابعة والتحكم",["• لوحة متابعة: النجوم، المستوى، الألعاب المفضلة، أيام اللعب، ومدة اللعب اليومية.","• سجل نشاط حديث لكل ملف.","• قفل ألعاب محددة لكل طفل وفتحها في أي وقت.","• تحديد حد يومي لوقت اللعب (من 10 دقائق إلى ساعتين أو بدون حد). عند انتهائه يتوقف اللعب ويحتاج تمديده لرمز PIN.","• إضافة أطفال متعددين وتعديل بياناتهم وحذفهم.","• تصدير البيانات وحذف الحساب نهائياً."]],["8. اللعب الصحي",["نشجّع على توازن صحي بين الشاشات والنشاط البدني والنوم. نوصي بما يلي:","• فاصل راحة كل 20 دقيقة تقريباً، والنظر لمسافة بعيدة 20 ثانية.","• الجلوس بوضعية سليمة وإضاءة مناسبة وشاشة على مسافة مريحة.","• عدم اللعب قبل النوم بساعة على الأقل.","• اللعب مع الطفل أحياناً ومناقشة ما تعلّمه."]],["9. إرشادات لولي الأمر للأمان الرقمي",["• اختر كلمة مرور قوية فريدة لحسابك ولا تشاركها.","• استخدم اسماً مستعاراً غير حقيقي للطفل.","• علّم طفلك ألا يشارك معلوماته الشخصية مع أي أحد على الإنترنت.","• أخبر طفلك أن يخبرك فوراً إذا رأى أي شيء يزعجه.","• حدّث نظام جهازك ومتصفحك باستمرار."]],["10. التزامات فريقنا",["• الوصول إلى بيانات الأطفال محصور في من يحتاجه فعلاً لتشغيل الخدمة أو الدعم الفني، ويلتزم بالسرية.","• لا نتواصل مع الأطفال مباشرةً بأي وسيلة.","• نراجع الألعاب والمحتوى قبل إضافتها لضمان ملاءمتها للأطفال."]],["11. الإبلاغ عن مشكلة أو مخاوف",["إذا لاحظت أي محتوى غير مناسب، أو مشكلة أمان، أو شككت في سوء استخدام بيانات طفل، راسلنا فوراً على {email} مع وصف المشكلة. نلتزم بالرد خلال 72 ساعة، والتعامل العاجل مع بلاغات سلامة الأطفال."]],["12. التعامل مع الحوادث",["عند حدوث اختراق أو تسريب يمس بيانات الأطفال: نوقف الخطر فوراً، نحقق في الأسباب، نبلغ أولياء الأمور المتأثرين والجهات المختصة وفق القانون، ونتخذ إجراءات لمنع التكرار."]],["13. حقوق الطفل",["• أن يلعب بأمان بعيداً عن الإعلانات والتواصل مع الغرباء.","• أن تُحترم خصوصيته وأن يُحذف ملفه متى طلب ولي أمره.","• أن يتعلم بأسلوب ممتع بلا ضغط أو مقارنة قاسية بالآخرين (لا توجد لوحات ترتيب عامة بين الأطفال)."]],["14. مراجعة السياسة",["نراجع هذه السياسة دورياً ونحدّثها مع تطوّر التطبيق والقوانين. آخر تحديث: {version}."]]]}},ye=e=>String(e).replace(/\{publisher\}/g,(window.APP_CONFIG||{}).publisher||"تطبيقات رصين").replace(/\{owner\}/g,(window.APP_CONFIG||{}).owner||"Khaled Ahmed").replace(/\{email\}/g,(window.APP_CONFIG||{}).contactEmail||"support@example.com").replace(/\{version\}/g,ue),g=e=>String(e).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");function se(e){const t=X[e];let i='<h2 class="lg-t">'+t.t+'</h2><p class="lg-v">آخر تحديث: '+ue+"</p>";return t.s.forEach(([r,s])=>{i+="<h3>"+g(r)+"</h3>";let o="";s.forEach(p=>{p=ye(p),p.startsWith("• ")?o+="<li>"+g(p.slice(2))+"</li>":(o&&(i+="<ul>"+o+"</ul>",o=""),i+="<p>"+g(p)+"</p>")}),o&&(i+="<ul>"+o+"</ul>")}),i}const E=window.APP_CONFIG||{},Y=String(E.primaryAdmin||"").toLowerCase();async function j(e){try{const t=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(e));return[...new Uint8Array(t)].map(i=>i.toString(16).padStart(2,"0")).join("")}catch{let i=5381;for(const r of e)i=(i<<5)+i+r.charCodeAt(0)|0;return"x"+(i>>>0).toString(16)}}const ne=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),ve={"auth/email-already-in-use":"البريد ده مسجّل قبل كده. جرّب تسجيل الدخول.","auth/invalid-email":"البريد الإلكتروني مش صحيح.","auth/weak-password":"كلمة المرور ضعيفة (8 حروف على الأقل).","auth/user-not-found":"مفيش حساب بالبريد ده.","auth/wrong-password":"كلمة المرور غلط.","auth/invalid-credential":"البريد أو كلمة المرور غلط.","auth/too-many-requests":"محاولات كتير. استنى شوية وجرّب تاني.","auth/network-request-failed":"مفيش اتصال بالإنترنت.","auth/popup-closed-by-user":"اتقفلت نافذة جوجل قبل ما تكمّل.","auth/popup-blocked":"المتصفح منع نافذة جوجل. اسمح بالنوافذ المنبثقة وجرّب تاني.","auth/operation-not-supported-in-this-environmen
